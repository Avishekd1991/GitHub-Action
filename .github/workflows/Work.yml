name: DemoProject

on:
  push:
    branches:
      -'main'
      - 'features/**'
      - 'hitflix/**'
jobs:
  terraform_init_plan:
    name: Terraform Job
    runs-on: GitHub-Runner
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
      - name: Install Terraform
        uses: little-core-labs/install-terraform@v2.0.0
        with:
          version: 1.13.0
          
