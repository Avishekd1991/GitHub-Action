name: DemoProject

on:
  push:
    branches:
      -'main'
      - 'features/**'
      - 'hitflix/**'
  workflow_dispatch:  
jobs:
  terraform_init_plan:
    name: Terraform Job
    runs-on: GitHub-Runner
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
      - name: Install Terraform
        uses: little-core-labs/install-terraform@v2.0.0
        with:
          version: 1.13.0
      - name: Azure Login
          uses: Azure/login@v2.3.0
          with:
            client-id: # optional
            tenant-id: # optional
            subscription-id: # optional
            
